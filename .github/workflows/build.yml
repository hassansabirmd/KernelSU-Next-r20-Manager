name: Build KernelSU-Next Manager 19d9e1f

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Manager from 19d9e1f
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: 29.0.14206865

    steps:

      # ============================================================
      # 1. Checkout EXACT KernelSU-Next commit
      # ============================================================

      - name: Checkout KernelSU-Next 19d9e1f
        uses: actions/checkout@v4
        with:
          repository: pershoot/KernelSU-Next
          ref: 19d9e1f255d4afedb85eb7032f4725cda6d25d36
          fetch-depth: 0


      # ============================================================
      # 2. Verify commit
      # ============================================================

      - name: Verify KernelSU commit
        run: |
          echo "Expected:"
          echo "19d9e1f255d4afedb85eb7032f4725cda6d25d36"

          echo ""
          echo "Actual:"
          git rev-parse HEAD

          echo ""
          git log -1 --oneline

          test "$(git rev-parse HEAD)" = \
            "19d9e1f255d4afedb85eb7032f4725cda6d25d36"


      # ============================================================
      # 3. Setup Java 21
      # ============================================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 4. Configure existing Android SDK
      #
      # DO NOT use android-actions/setup-android.
      # ============================================================

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          ls -la "$ANDROID_SDK_ROOT"

          echo ""
          echo "Available command line tools:"
          find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 2 -type f \
            -name sdkmanager -print


      # ============================================================
      # 5. Locate sdkmanager
      # ============================================================

      - name: Check sdkmanager
        run: |
          SDKMANAGER=""

          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print -quit)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 6. Accept licenses
      # ============================================================

      - name: Accept Android licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true


      # ============================================================
      # 7. Install required Android SDK packages
      #
      # NO "tools" PACKAGE HERE.
      # ============================================================

      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865"


      # ============================================================
      # 8. Configure NDK
      # ============================================================

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" \
            >> "$GITHUB_ENV"

          echo "NDK:"
          ls -la "$ANDROID_SDK_ROOT/ndk/29.0.14206865"


      # ============================================================
      # 9. Install Linux dependencies
      # ============================================================

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            llvm \
            lld \
            curl \
            git \
            pkg-config


      # ============================================================
      # 10. Setup Rust
      # ============================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android


      # ============================================================
      # 11. Install Cross
      # ============================================================

      - name: Install cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross


      # ============================================================
      # 12. Verify build environment
      # ============================================================

      - name: Verify build environment
        run: |
          echo "================================"
          echo "Java"
          echo "================================"
          java -version

          echo ""
          echo "================================"
          echo "Rust"
          echo "================================"
          rustc --version
          cargo --version
          cross --version

          echo ""
          echo "================================"
          echo "Android"
          echo "================================"
          "$SDKMANAGER" --version

          echo ""
          echo "================================"
          echo "NDK"
          echo "================================"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version


      # ============================================================
      # 13. Build ksud
      # ============================================================

      - name: Build ksud ARM64
        run: |
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"

          CROSS_NO_WARNINGS=0 cross build \
            --target aarch64-linux-android \
            --release \
            --manifest-path ./userspace/ksud/Cargo.toml


      # ============================================================
      # 14. Verify ksud
      # ============================================================

      - name: Verify ksud
        run: |
          ls -lh \
            userspace/ksud/target/aarch64-linux-android/release/ksud

          file \
            userspace/ksud/target/aarch64-linux-android/release/ksud


      # ============================================================
      # 15. Copy ksud into Manager
      # ============================================================

      - name: Copy ksud
        run: |
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a

          cp \
            userspace/ksud/target/aarch64-linux-android/release/ksud \
            manager/app/src/main/jniLibs/arm64-v8a/libksud.so

          ls -lh \
            manager/app/src/main/jniLibs/arm64-v8a/libksud.so


      # ============================================================
      # 16. Run Manager setup
      # ============================================================

      - name: Run Manager setup.sh
        working-directory: manager
        run: |
          chmod +x setup.sh
          ./setup.sh


      # ============================================================
      # 17. Build APK
      # ============================================================

      - name: Build Manager APK
        working-directory: manager
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease


      # ============================================================
      # 18. Find APK
      # ============================================================

      - name: Find APK
        run: |
          echo "================================"
          echo "APK OUTPUT"
          echo "================================"

          find manager/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # ============================================================
      # 19. Upload APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Manager-19d9e1f-r20
          path: manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error