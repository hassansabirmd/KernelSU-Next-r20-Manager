name: Build KernelSU-Next Manager 19d9e1f

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Manager from 19d9e1f
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout EXACT r20 KernelSU-Next commit
      # ============================================================

      - name: Checkout KernelSU-Next 19d9e1f
        uses: actions/checkout@v4
        with:
          repository: pershoot/KernelSU-Next
          ref: 19d9e1f255d4afedb85eb7032f4725cda6d25d36
          fetch-depth: 0


      # ============================================================
      # 2. Verify we really have the correct commit
      # ============================================================

      - name: Verify commit
        run: |
          echo "Expected:"
          echo "19d9e1f255d4afedb85eb7032f4725cda6d25d36"

          echo ""
          echo "Actual:"
          git rev-parse HEAD

          echo ""
          git log -1 --oneline

          test "$(git rev-parse HEAD)" = \
          "19d9e1f255d4afedb85eb7032f4725cda6d25d36"


      # ============================================================
      # 3. Java 21
      # ============================================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 4. Android SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 5. Install SDK / NDK versions used by this commit
      #
      # IMPORTANT:
      # Do NOT install "tools"
      # ============================================================

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865"


      # ============================================================
      # 6. Configure Android NDK
      # ============================================================

      - name: Configure Android environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"


      # ============================================================
      # 7. Install Linux build dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            llvm \
            lld \
            curl \
            git \
            pkg-config


      # ============================================================
      # 8. Rust
      # ============================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android


      # ============================================================
      # 9. Install Cross
      #
      # The 19d9e1f build.sh explicitly uses "cross".
      # ============================================================

      - name: Install cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross


      # ============================================================
      # 10. Verify Android NDK
      # ============================================================

      - name: Verify Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version

          rustc --version
          cargo --version
          cross --version


      # ============================================================
      # 11. Build ksud EXACTLY like 19d9e1f build.sh
      # ============================================================

      - name: Build ksud ARM64
        run: |
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android -I$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"

          CROSS_NO_WARNINGS=0 cross build \
            --target aarch64-linux-android \
            --release \
            --manifest-path ./userspace/ksud/Cargo.toml


      # ============================================================
      # 12. Verify ksud
      # ============================================================

      - name: Verify ksud
        run: |
          ls -lh \
            userspace/ksud/target/aarch64-linux-android/release/ksud

          file \
            userspace/ksud/target/aarch64-linux-android/release/ksud


      # ============================================================
      # 13. Copy ksud into Manager
      #
      # This is exactly what 19d9e1f build.sh does.
      # ============================================================

      - name: Copy ksud into Manager
        run: |
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a

          cp \
            userspace/ksud/target/aarch64-linux-android/release/ksud \
            manager/app/src/main/jniLibs/arm64-v8a/libksud.so

          ls -lh \
            manager/app/src/main/jniLibs/arm64-v8a/libksud.so


      # ============================================================
      # 14. Run the EXACT Manager setup.sh from 19d9e1f
      # ============================================================

      - name: Run Manager setup.sh
        working-directory: manager
        run: |
          chmod +x setup.sh
          ./setup.sh


      # ============================================================
      # 15. Display generated APK
      # ============================================================

      - name: Find APK
        run: |
          echo "Generated APK:"
          find manager/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print


      # ============================================================
      # 16. Upload APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Manager-19d9e1f-r20
          path: manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error