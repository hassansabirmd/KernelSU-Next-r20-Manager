name: Build KernelSU-Next Manager - r20

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Manager from 19d9e1f
    runs-on: ubuntu-22.04

    steps:
      # ---------------------------------------------------------
      # 1. Checkout EXACT KernelSU-Next commit used by WildKernels r20
      # ---------------------------------------------------------
      - name: Checkout KernelSU-Next r20 commit
        uses: actions/checkout@v4
        with:
          repository: pershoot/KernelSU-Next
          ref: 19d9e1f255d4afedb85eb7032f4725cda6d25d36
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Java
      # ---------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ---------------------------------------------------------
      # 3. Android SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------
      # 4. Android NDK
      # ---------------------------------------------------------
      - name: Install Android SDK / NDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      # ---------------------------------------------------------
      # 5. Set Android environment
      # ---------------------------------------------------------
      - name: Configure Android environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 6. Install build dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            lld \
            curl \
            git

      # ---------------------------------------------------------
      # 7. Install Rust
      # ---------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ---------------------------------------------------------
      # 8. Install cargo-cross
      # ---------------------------------------------------------
      - name: Install cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      # ---------------------------------------------------------
      # 9. Build ksud
      # ---------------------------------------------------------
      - name: Build ksud
        run: |
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"

          cross build \
            --target aarch64-linux-android \
            --release \
            --manifest-path ./userspace/ksud/Cargo.toml

      # ---------------------------------------------------------
      # 10. Put ksud inside Manager APK
      # ---------------------------------------------------------
      - name: Copy ksud into Manager
        run: |
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a

          cp \
            userspace/ksud/target/aarch64-linux-android/release/ksud \
            manager/app/src/main/jniLibs/arm64-v8a/libksud.so

      # ---------------------------------------------------------
      # 11. Run KernelSU-Next Manager setup
      # ---------------------------------------------------------
      - name: Setup Manager
        working-directory: manager
        run: |
          chmod +x setup.sh
          ./setup.sh

      # ---------------------------------------------------------
      # 12. Build APK
      # ---------------------------------------------------------
      - name: Build Manager APK
        working-directory: manager
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease

      # ---------------------------------------------------------
      # 13. Upload APK
      # ---------------------------------------------------------
      - name: Upload KernelSU-Next Manager
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-r20-19d9e1f
          path: |
            manager/app/build/outputs/apk/release/*.apk